spring.application.name=fooddonation

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/food_donation_db
spring.datasource.username=root
spring.datasource.password=root

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway - schema is now managed by versioned migrations, not Hibernate.
# baseline-on-migrate adopts the existing database without wiping data.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Server Configuration
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# ---- Spring Session (Redis-backed, shareable across app instances) ----
spring.session.store-type=redis
spring.session.timeout=30m
spring.data.redis.timeout=2s

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Logging
logging.level.com.app.fooddonation=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Timezone handling
spring.jackson.time-zone=Asia/Kolkata

# ---- Groq AI (free LLM API) ----
groq.api.key=${GROQ_API_KEY:}
groq.api.model=llama-3.3-70b-versatile
groq.api.base-url=https://api.groq.com/openai/v1

# ---- Resilience4j (circuit breaker + retry for Groq) ----
resilience4j.circuitbreaker.instances.groq.register-health-indicator=true
resilience4j.circuitbreaker.instances.groq.sliding-window-size=10
resilience4j.circuitbreaker.instances.groq.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=30s
resilience4j.retry.instances.groq.max-attempts=3
resilience4j.retry.instances.groq.wait-duration=1s
resilience4j.retry.instances.groq.enable-exponential-backoff=true

# ---- JWT (stateless REST API auth) ----
app.jwt.secret=${JWT_SECRET:dev-placeholder-change-me-0123456789abcdef0123456789abcdef}
app.jwt.expiration-ms=86400000

# ---- Scheduled jobs ----
app.jobs.expiry-interval-ms=300000
app.jobs.expiry-initial-delay-ms=15000

# ---- Redis cache ----
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ---- Rate limiting storage ----
# redis = distributed (shared across instances), local = per-instance (tests)
app.ratelimit.storage=redis
app.ratelimit.enabled=true

# ---- Login lockout / brute-force protection ----
app.security.login-lockout.enabled=true
app.security.login-lockout.max-attempts=5
app.security.login-lockout.refill-minutes=5

# ---- Email (Mailpit in dev; set SPRING_MAIL_* for any SMTP provider) ----
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.enabled=true
app.base-url=http://localhost:8080

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# No SMTP on free hosting -> keep health check green without a mail server
management.health.mail.enabled=false
management.metrics.tags.application=foodshare
info.app.name=FoodShare
info.app.description=AI-powered food donation marketplace connecting donors with NGOs
info.app.version=2.0.0

# ---- OpenAPI / Swagger ----
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html