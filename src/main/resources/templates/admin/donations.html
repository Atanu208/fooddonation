<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('All Donations - FoodShare')}"></head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mx-auto px-4 py-8">
    <div class="mb-6">
        <h1 class="text-3xl font-bold text-gray-800">
            <i class="fas fa-utensils text-green-500 mr-2"></i>All Donations
        </h1>
        <p class="text-gray-600" th:text="${'Total: ' + donations.totalElements}">Total: 0</p>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6 overflow-x-auto">
        <table class="w-full">
            <thead>
            <tr class="bg-gray-50">
                <th class="px-4 py-2 text-left">ID</th>
                <th class="px-4 py-2 text-left">Food</th>
                <th class="px-4 py-2 text-left">Donor</th>
                <th class="px-4 py-2 text-left">NGO</th>
                <th class="px-4 py-2 text-left">City</th>
                <th class="px-4 py-2 text-left">Status</th>
                <th class="px-4 py-2 text-left">Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="donation : ${donations.content}" class="border-t">
                <td class="px-4 py-2" th:text="${donation.id}">1</td>
                <td class="px-4 py-2" th:text="${donation.foodDescription}">Food</td>
                <td class="px-4 py-2" th:text="${donation.donor.name}">Donor</td>
                <td class="px-4 py-2" th:text="${donation.ngo != null ? donation.ngo.name : '-'}">-</td>
                <td class="px-4 py-2" th:text="${donation.pickupCity ?: '-'}">City</td>
                <td class="px-4 py-2">
                    <span class="px-2 py-1 rounded text-sm"
                          th:class="${donation.status.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' : donation.status.name() == 'CANCELLED' || donation.status.name() == 'EXPIRED' ? 'bg-red-100 text-red-800' : donation.status.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' : 'bg-blue-100 text-blue-800'}"
                          th:text="${donation.status.displayName}">Pending</span>
                </td>
                <td class="px-4 py-2">
                    <a th:href="@{/donation/{id}(id=${donation.id})}" class="text-blue-500 hover:text-blue-700">
                        <i class="fas fa-eye"></i> View
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-6 flex justify-between items-center">
        <a th:if="${donations.hasPrevious()}" th:href="@{/admin/donations(page=${donations.number - 1})}"
           class="text-blue-500 hover:text-blue-700"><i class="fas fa-arrow-left"></i> Previous</a>
        <span class="text-gray-500" th:text="${'Page ' + (donations.number + 1) + ' of ' + (donations.totalPages == 0 ? 1 : donations.totalPages)}">Page 1 of 1</span>
        <a th:if="${donations.hasNext()}" th:href="@{/admin/donations(page=${donations.number + 1})}"
           class="text-blue-500 hover:text-blue-700">Next <i class="fas fa-arrow-right"></i></a>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
