<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${status != null ? status + ' - Error' : 'Error'}">Error - FoodShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
<div class="text-center px-4">
    <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fas fa-exclamation-triangle text-red-500 text-4xl"></i>
    </div>
    <h1 class="text-6xl font-extrabold text-gray-800 mb-4" th:text="${status} ?: 'Oops'">Error</h1>
    <h2 class="text-2xl font-bold text-gray-700 mb-2">
        <span th:if="${status == 403}">Access Denied</span>
        <span th:if="${status == 404}">Page Not Found</span>
        <span th:if="${status != 403 and status != 404}">Something went wrong</span>
    </h2>
    <p class="text-gray-500 mb-8 max-w-md mx-auto">
        <span th:text="${error}">Error</span>
        <span th:if="${message}" th:text="' - ' + ${message}"></span>
    </p>
    <div class="flex justify-center gap-4">
        <a href="/dashboard"
           class="bg-green-500 hover:bg-green-600 text-white font-bold px-6 py-3 rounded-lg transition">
            <i class="fas fa-tachometer-alt mr-2"></i>Go to Dashboard
        </a>
        <a href="/"
           class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold px-6 py-3 rounded-lg transition">
            <i class="fas fa-home mr-2"></i>Home
        </a>
    </div>
</div>
</body>
</html>
