<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('My Donations - FoodShare')}"></head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">
            <i class="fas fa-list text-green-500 mr-2"></i>My Donations
        </h1>
        <a href="/donor/create-donation"
           class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">
            <i class="fas fa-plus mr-2"></i>New Donation
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-md p-6">
        <div th:if="${donations != null && !donations.isEmpty()}">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                    <tr class="bg-gray-50">
                        <th class="px-4 py-2 text-left">ID</th>
                        <th class="px-4 py-2 text-left">Food</th>
                        <th class="px-4 py-2 text-left">NGO</th>
                        <th class="px-4 py-2 text-left">Status</th>
                        <th class="px-4 py-2 text-left">Pickup Time</th>
                        <th class="px-4 py-2 text-left">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="donation : ${donations}" class="border-t hover:bg-gray-50">
                        <td class="px-4 py-2" th:text="${donation.id}">1</td>
                        <td class="px-4 py-2" th:text="${donation.foodDescription}">Food</td>
                        <td class="px-4 py-2">
                            <span th:if="${donation.ngo != null}" th:text="${donation.ngo.name}">NGO</span>
                            <span th:if="${donation.ngo == null}" class="text-gray-400">Not assigned</span>
                        </td>
                        <td class="px-4 py-2">
                                    <span class="px-2 py-1 rounded text-sm"
                                          th:class="${donation.status.name() == 'PENDING' ? 'bg-yellow-100 text-yellow-800' : donation.status.name() == 'ACCEPTED' ? 'bg-blue-100 text-blue-800' : donation.status.name() == 'PICKED_UP' ? 'bg-purple-100 text-purple-800' : donation.status.name() == 'DELIVERED' ? 'bg-indigo-100 text-indigo-800' : donation.status.name() == 'COMPLETED' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}"
                                          th:text="${donation.status.displayName}">Pending</span>
                        </td>
                        <td class="px-4 py-2" th:text="${#temporals.format(donation.pickupTime, 'dd/MM/yyyy HH:mm')}">Date</td>
                        <td class="px-4 py-2">
                            <div class="flex gap-2">
                                <a th:href="@{/donation/{id}(id=${donation.id})}"
                                   class="text-blue-500 hover:text-blue-700">
                                    <i class="fas fa-eye"></i>
                                </a>
                                <form th:if="${donation.status.name() == 'DELIVERED'}"
                                      th:action="@{/donation/update-status/{id}(id=${donation.id})}" method="post" class="inline">
                                    <input type="hidden" name="status" value="COMPLETED">
                                    <button type="submit" class="text-green-500 hover:text-green-700"
                                            onclick="return confirm('Confirm that this donation has been received and distributed?')"
                                            title="Mark as Completed">
                                        <i class="fas fa-check-circle"></i>
                                    </button>
                                </form>
                                <form th:if="${donation.status.name() == 'PENDING' || donation.status.name() == 'ACCEPTED'}"
                                      th:action="@{/donation/cancel/{id}(id=${donation.id})}" method="post" class="inline">
                                    <input type="hidden" name="reason" value="Cancelled by donor">
                                    <button type="submit" class="text-red-500 hover:text-red-700"
                                            onclick="return confirm('Are you sure you want to cancel this donation?')">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div th:if="${donations == null || donations.isEmpty()}" class="text-center py-12">
            <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
            <p class="text-gray-500 text-lg">You haven't made any donations yet.</p>
            <a href="/donor/create-donation" class="text-green-500 hover:text-green-600 font-semibold">
                Create your first donation now!
            </a>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
