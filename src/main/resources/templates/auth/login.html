<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Donation Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-r from-green-400 to-blue-500 min-h-screen flex items-center justify-center">
<div class="bg-white rounded-lg shadow-2xl max-w-md w-full p-8">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            <i class="fas fa-utensils text-green-500 mr-2"></i>FoodShare
        </h1>
        <p class="text-gray-600 mt-2">Sign in to your account</p>
    </div>

    <div th:if="${param.error}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        <i class="fas fa-exclamation-circle mr-2"></i>Invalid email or password.
    </div>

    <div th:if="${param.locked}" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
        <i class="fas fa-lock mr-2"></i>Too many failed attempts. Your account is temporarily locked - try again in a few minutes.
    </div>

    <div th:if="${param.logout}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        <i class="fas fa-check-circle mr-2"></i>You have been logged out successfully.
    </div>

    <div th:if="${success}" class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4">
        <i class="fas fa-check-circle mr-2"></i>
        <span th:text="${success}"></span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-4">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="email">
                <i class="fas fa-envelope mr-2"></i>Email
            </label>
            <input type="email" id="email" name="username" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500"
                   placeholder="Enter your email">
        </div>

        <div class="mb-6">
            <label class="block text-gray-700 text-sm font-bold mb-2" for="password">
                <i class="fas fa-lock mr-2"></i>Password
            </label>
            <input type="password" id="password" name="password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-green-500"
                   placeholder="Enter your password">
        </div>

        <button type="submit"
                class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200">
            <i class="fas fa-sign-in-alt mr-2"></i>Sign In
        </button>
    </form>

    <div class="mt-6 text-center">
        <p class="text-gray-600">
            Don't have an account?
            <a href="/register" class="text-green-500 hover:text-green-600 font-semibold">
                Register here
            </a>
        </p>
    </div>

    <div class="mt-4 text-center">
        <a href="/" class="text-gray-500 hover:text-gray-700 text-sm">
            <i class="fas fa-arrow-left mr-1"></i>Back to Home
        </a>
    </div>
</div>
</body>
</html>
