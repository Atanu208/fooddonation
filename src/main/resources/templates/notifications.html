<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout/base :: head('Notifications - FoodShare')}"></head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mx-auto px-4 py-8">
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-bold text-gray-800">
                <i class="fas fa-bell text-green-500 mr-2"></i>Notifications
            </h1>
            <p class="text-gray-600" th:text="${unread} + ' unread'">0 unread</p>
        </div>
        <form th:action="@{/notifications/read-all}" method="post" th:if="${unread > 0}">
            <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition">
                <i class="fas fa-check-double mr-1"></i> Mark all as read
            </button>
        </form>
    </div>

    <div th:if="${notifications == null || notifications.isEmpty()}" class="text-center py-16 bg-white rounded-lg shadow-md">
        <i class="fas fa-bell-slash text-4xl text-gray-300 mb-2"></i>
        <p class="text-gray-500">No notifications yet. Activity on your donations will appear here.</p>
    </div>

    <div th:unless="${notifications == null || notifications.isEmpty()}" class="space-y-3">
        <div th:each="notification : ${notifications}"
             th:class="${notification.isRead() ? 'bg-white rounded-lg shadow-md p-4' : 'bg-green-50 border-l-4 border-green-500 rounded-lg shadow-md p-4'}">
            <div class="flex items-start justify-between">
                <div class="flex items-start space-x-3">
                    <div>
                        <p class="font-semibold text-gray-800">
                            <span th:text="${notification.title}"></span>
                            <span th:if="${!notification.isRead()}" class="ml-2 inline-block w-2 h-2 bg-green-500 rounded-full"></span>
                        </p>
                        <p class="text-gray-600 text-sm" th:text="${notification.message}"></p>
                        <p class="text-gray-400 text-xs mt-1" th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, HH:mm')}"></p>
                    </div>
                </div>
                <form th:if="${!notification.isRead()}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                    <button type="submit" class="text-green-600 hover:text-green-800 text-sm">
                        <i class="fas fa-check"></i> Mark read
                    </button>
                </form>
            </div>
            <div th:if="${notification.donationId != null}" class="mt-2">
                <a th:href="@{/donation/{id}(id=${notification.donationId})}"
                   class="text-blue-500 hover:text-blue-700 text-sm">
                    <i class="fas fa-external-link-alt mr-1"></i>View donation
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
