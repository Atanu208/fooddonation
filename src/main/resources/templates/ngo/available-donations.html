<!-- src/main/resources/templates/ngo/available-donations.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/base :: head('Available Donations - FoodShare')}"></head>
<body>
<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">
        <i class="fas fa-search text-green-500 mr-2"></i>Available Donations
    </h1>

    <!-- City Filter + Search -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <form method="get" th:action="@{/ngo/available-donations}" class="flex gap-4">
            <div class="flex-1">
                <label class="block text-gray-700 font-bold mb-2">Your City</label>
                <input type="text" name="city" th:value="${filterCity != null ? filterCity : ngo.city}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg"
                       placeholder="Enter your city">
            </div>
            <div class="flex-1">
                <label class="block text-gray-700 font-bold mb-2">Search Food</label>
                <input type="text" name="q" th:value="${searchQuery}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg"
                       placeholder="e.g. biryani, rice, Mumbai">
            </div>
            <div class="flex items-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
                    <i class="fas fa-search mr-2"></i>Search
                </button>
                <a th:href="@{/ngo/available-donations}" class="ml-2 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg">
                    Clear
                </a>
            </div>
        </form>
    </div>

    <div th:if="${searchQuery != null && !searchQuery.isBlank()}" class="mb-6">
        <p class="text-gray-600">
            <i class="fas fa-info-circle mr-1"></i>
            Showing matches for <strong>"<span th:text="${searchQuery}">search</span>"</strong>
            (<span th:text="${#lists.size(cityDonations) + #lists.size(allPendingDonations)}">0</span> results)
        </p>
    </div>

    <!-- City Donations -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 class="text-xl font-bold mb-4">
            <i class="fas fa-city text-green-500 mr-2"></i>
            In Your City
        </h2>
        <div th:if="${cityDonations != null && !cityDonations.isEmpty()}">
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="donation : ${cityDonations}"
                     class="border rounded-lg p-4 hover:shadow-lg transition">
                    <h3 class="font-bold text-lg" th:text="${donation.foodDescription}">Food</h3>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-user mr-1"></i>
                        <span th:text="${donation.donor.name}">Donor</span>
                    </p>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-map-marker-alt mr-1"></i>
                        <span th:text="${donation.pickupAddress}">Address</span>
                    </p>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-clock mr-1"></i>
                        <span th:text="${#temporals.format(donation.pickupTime, 'dd/MM/yyyy HH:mm')}">Time</span>
                    </p>
                    <div class="mt-3">
                        <form th:action="@{/ngo/accept/{id}(id=${donation.id})}" method="post">
                            <button type="submit"
                                    class="w-full bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">
                                <i class="fas fa-hand-holding-heart mr-2"></i>Accept Donation
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${cityDonations == null || cityDonations.isEmpty()}" class="text-center py-8">
            <p class="text-gray-500">No donations available in your city.</p>
        </div>
    </div>

    <!-- All Pending Donations -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-xl font-bold mb-4">
            <i class="fas fa-globe text-green-500 mr-2"></i>
            All Pending Donations
        </h2>
        <div th:if="${allPendingDonations != null && !allPendingDonations.isEmpty()}">
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div th:each="donation : ${allPendingDonations}"
                     class="border rounded-lg p-4 hover:shadow-lg transition">
                    <h3 class="font-bold text-lg" th:text="${donation.foodDescription}">Food</h3>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-user mr-1"></i>
                        <span th:text="${donation.donor.name}">Donor</span>
                    </p>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-map-marker-alt mr-1"></i>
                        <span th:text="${donation.pickupCity}">City</span>
                    </p>
                    <p class="text-gray-600 text-sm">
                        <i class="fas fa-clock mr-1"></i>
                        <span th:text="${#temporals.format(donation.pickupTime, 'dd/MM/yyyy HH:mm')}">Time</span>
                    </p>
                    <div class="mt-3">
                        <form th:action="@{/ngo/accept/{id}(id=${donation.id})}" method="post">
                            <button type="submit"
                                    class="w-full bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg transition">
                                <i class="fas fa-hand-holding-heart mr-2"></i>Accept Donation
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div th:if="${allPendingDonations == null || allPendingDonations.isEmpty()}" class="text-center py-8">
            <i class="fas fa-check-circle text-4xl text-gray-300 mb-2"></i>
            <p class="text-gray-500">No pending donations available.</p>
        </div>
    </div>
</div>

<div th:replace="~{layout/base :: footer}"></div>
</body>
</html>
